<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Katak Lompat - Advance Effect</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #081105;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-board {
            width: 1000px;
            height: 560px;
            background: radial-gradient(circle at 50% 50%, #2fbdf1 0%, #1793d1 70%, #0e6799 100%);
            position: relative;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            overflow: hidden;
            border: 5px solid #0d4a6e;
        }

        /* Water Waves Effect */
        .water-wave-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0.45;
            pointer-events: none;
            transition: transform 0.6s ease-in-out;
        }

        /* --- TOP BAR HEADER --- */
        #top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 58px;
            background-color: #74ba1f;
            border-bottom: 4px solid #558a14;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 18px;
            z-index: 50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .hud-box {
            background-color: rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 4px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-family: 'Fredoka One', cursive;
            font-size: 14px;
        }

        .hud-value {
            font-size: 18px;
            color: #ffffff;
        }

        .hud-icon-heart {
            color: #ffffff;
            font-size: 18px;
        }

        .hud-icon-e {
            background-color: #ffffff;
            color: #74ba1f;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
        }

        .game-title {
            color: #ffffff;
            font-family: 'Fredoka One', cursive;
            font-size: 22px;
            letter-spacing: 1px;
            text-shadow: 1px 2px 3px rgba(0,0,0,0.3);
        }

        /* --- QUESTION BOX --- */
        #question-panel {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 12px 24px;
            text-align: center;
            border: 3px solid #f39c12;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            z-index: 40;
            transition: opacity 0.3s;
        }

        .q-badge {
            background-color: #e67e22;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 2px 10px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .q-text {
            color: #2c3e50;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            line-height: 1.3;
        }

        /* --- WORLD LAYER (LAYER UNTUK ANIMASI MAJU / SCROLL) --- */
        #world-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- LILY PAD CONTAINER --- */
        .pad-container {
            position: absolute;
            width: 155px;
            height: 155px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
        }

        .pad-container:hover {
            transform: scale(1.08) rotate(2deg);
        }

        .pad-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 10px 8px rgba(0,0,0,0.45));
        }

        .pad-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-family: 'Fredoka One', cursive;
            font-size: 14px;
            text-align: center;
            width: 78%;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
            line-height: 1.25;
            text-transform: uppercase;
        }

        /* --- KATAK (FROG PLAYER) --- */
        #frog-player {
            position: absolute;
            width: 120px;
            height: 120px;
            z-index: 30;
            pointer-events: none;
            transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), top 0.4s cubic-bezier(0.25, 1, 0.5, 1), transform 0.6s ease;
            transform: translate(-50%, -50%);
        }

        .frog-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 8px 6px rgba(0,0,0,0.4));
        }

        /* --- ANIMASI TENGGELAM --- */
        .sinking {
            animation: sinkOrganic 1.2s forwards cubic-bezier(0.55, 0.085, 0.68, 0.53) !important;
        }

        @keyframes sinkOrganic {
            0% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
                filter: none;
            }
            50% {
                transform: scale(0.6) rotate(20deg) translateY(20px);
                opacity: 0.6;
                filter: blur(1px);
            }
            100% {
                transform: scale(0) rotate(50deg) translateY(60px);
                opacity: 0;
                filter: blur(6px);
            }
        }

        /* --- WATER SPLASH --- */
        .water-splash {
            position: absolute;
            width: 140px;
            height: 70px;
            border: 4px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            pointer-events: none;
            z-index: 25;
            animation: splashExpand 0.75s ease-out forwards;
        }

        @keyframes splashExpand {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        /* --- BOTTOM CONTROLS --- */
        #bottom-bar {
            position: absolute;
            bottom: 14px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 50;
        }

        .timer-widget {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .timer-circle {
            width: 52px;
            height: 52px;
            background: #ffffff;
            border-radius: 50%;
            border: 5px solid #74ba1f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fredoka One', cursive;
            font-size: 20px;
            color: #2c3e50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .timer-pill {
            background-color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-family: 'Fredoka One', cursive;
            font-size: 16px;
            color: #2c3e50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .btn-icon {
            width: 44px;
            height: 44px;
            background-color: #92db2c;
            border: 2px solid #ffffff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            color: #2c3e50;
            font-size: 18px;
        }

        /* --- MODAL --- */
        .modal-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 420px;
            border: 5px solid #74ba1f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-card h2 {
            font-family: 'Fredoka One', cursive;
            color: #558a14;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .modal-card p {
            font-size: 15px;
            color: #555;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .btn-start {
            background: #74ba1f;
            color: #fff;
            border: none;
            padding: 12px 36px;
            font-family: 'Fredoka One', cursive;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0 #436d10;
            transition: transform 0.1s;
        }

        .btn-start:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #436d10;
        }
    </style>
</head>

<!-- Modal Screen -->
<div class="modal-bg" id="modal">
    <div class="modal-card">
        <h2 id="modal-title">KUIS KATAK LOMPAT</h2>
        <p id="modal-desc">Pilih daun teratai yang benar untuk membantu katak menyeberang! Jika salah, teratai dan katak akan tenggelam.</p>
        <button class="btn-start" onclick="startGame()">MULAI MAIN</button>
    </div>
</div>

<script>
    const questions = [
        {
            q: "Organel sel yang menghasilkan energi ATP utama adalah...",
            options: { A: "Mitokondria", B: "Lisosom", C: "Ribosom" },
            correct: "A"
        },
        {
            q: "Proses perpindahan air melalui membran semipermeabel adalah...",
            options: { A: "Difusi", B: "Osmosis", C: "Endositosis" },
            correct: "B"
        },
        {
            q: "Bagian sel yang HANYA dimiliki oleh sel tumbuhan adalah...",
            options: { A: "Membran Sel", B: "Dinding Sel", C: "Centriol" },
            correct: "B"
        },
        {
            q: "Sintesis protein di dalam sel terjadi pada organel...",
            options: { A: "Badan Golgi", B: "Vakuola", C: "Ribosom" },
            correct: "C"
        },
        {
            q: "Cairan pengisi di dalam sel tempat organel melayang disebut...",
            options: { A: "Sitoplasma", B: "Nukleus", C: "Membran" },
            correct: "A"
        }
    ];

    let currentQIndex = 0;
    let lives = 10;
    let score = 0;
    let timeLeft = 18;
    let timerInterval = null;
    let isAnimating = false;

    const padCoords = {
        start: { x: 500, y: 452 },
        A: { x: 252, y: 322 },
        B: { x: 500, y: 292 },
        C: { x: 748, y: 322 }
    };

    function startGame() {
        document.getElementById('modal').style.display = 'none';
        currentQIndex = 0;
        lives = 10;
        score = 0;
        updateHUD();
        loadQuestion();
    }

    function updateHUD() {
        document.getElementById('lives-val').textContent = lives;
        document.getElementById('score-val').textContent = score;
    }

    function loadQuestion() {
        if (currentQIndex >= questions.length) {
            showEndGame(true);
            return;
        }

        isAnimating = false;
        resetPadsAndFrog();

        const q = questions[currentQIndex];
        document.getElementById('q-number').textContent = `Pertanyaan ${currentQIndex + 1} / ${questions.length}`;
        document.getElementById('q-text').textContent = q.q;

        document.getElementById('text-A').textContent = q.options.A;
        document.getElementById('text-B').textContent = q.options.B;
        document.getElementById('text-C').textContent = q.options.C;

        startTimer();
    }

    function resetPadsAndFrog() {
        const worldLayer = document.getElementById('world-layer');
        const qPanel = document.getElementById('question-panel');
        
        // Reset Transform World & Opacity
        worldLayer.style.transition = 'none';
        worldLayer.style.transform = 'translateY(0px)';
        qPanel.style.opacity = '1';

        ['A', 'B', 'C'].forEach(id => {
            const pad = document.getElementById(`pad-${id}`);
            pad.classList.remove('sinking');
            pad.style.opacity = '1';
        });

        const frog = document.getElementById('frog-player');
        frog.classList.remove('sinking');
        frog.style.opacity = '1';
        frog.style.left = padCoords.start.x + 'px';
        frog.style.top = padCoords.start.y + 'px';
    }

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 18;
        updateTimerDisplay();

        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleWrongAnswer('timeout');
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        document.getElementById('timer-sec').textContent = timeLeft;
        document.getElementById('timer-digit').textContent = timeLeft < 10 ? '0' + timeLeft : timeLeft;
    }

    function selectOption(choice) {
        if (isAnimating) return;
        isAnimating = true;
        clearInterval(timerInterval);

        const frog = document.getElementById('frog-player');
        const targetPos = padCoords[choice];
        const currentQ = questions[currentQIndex];

        // 1. Katak Melompat ke pilihan
        frog.style.left = targetPos.x + 'px';
        frog.style.top = targetPos.y + 'px';

        setTimeout(() => {
            if (choice === currentQ.correct) {
                score += 100;
                updateHUD();
                
                // 2. Animasi Katak & Kolam Meluncur Maju Ke Depan
                animateAdvanceForward(choice);
            } else {
                handleWrongAnswer(choice);
            }
        }, 400);
    }

    function animateAdvanceForward(correctChoice) {
        const worldLayer = document.getElementById('world-layer');
        const qPanel = document.getElementById('question-panel');

        // Sembunyikan pilihan yang salah
        ['A', 'B', 'C'].forEach(id => {
            if (id !== correctChoice) {
                document.getElementById(`pad-${id}`).style.opacity = '0';
            }
        });

        // Hitung jarak meluncur turun (Sesuai posisi Y daun yang dipilih)
        const offsetY = padCoords.start.y - padCoords[correctChoice].y;

        // Efek Meluncur (Katak seolah terus berjalan ke depan)
        setTimeout(() => {
            qPanel.style.opacity = '0';
            worldLayer.style.transition = 'transform 0.55s cubic-bezier(0.4, 0, 0.2, 1)';
            worldLayer.style.transform = `translateY(${offsetY}px)`;
        }, 150);

        setTimeout(() => {
            currentQIndex++;
            loadQuestion();
        }, 750);
    }

    function handleWrongAnswer(choice) {
        lives--;
        updateHUD();

        if (choice !== 'timeout') {
            const pad = document.getElementById(`pad-${choice}`);
            const frog = document.getElementById('frog-player');

            createSplash(padCoords[choice].x, padCoords[choice].y);

            pad.classList.add('sinking');
            frog.classList.add('sinking');
        }

        setTimeout(() => {
            if (lives <= 0) {
                showEndGame(false);
            } else {
                resetPadsAndFrog();
                isAnimating = false;
                startTimer();
            }
        }, 1200);
    }

    function createSplash(x, y) {
        const board = document.getElementById('game-board');
        const splash = document.createElement('div');
        splash.className = 'water-splash';
        splash.style.left = (x - 70) + 'px';
        splash.style.top = (y - 35) + 'px';
        board.appendChild(splash);

        setTimeout(() => splash.remove(), 750);
    }

    function showEndGame(isWin) {
        clearInterval(timerInterval);
        const modal = document.getElementById('modal');
        const title = document.getElementById('modal-title');
        const desc = document.getElementById('modal-desc');

        if (isWin) {
            title.textContent = "SELAMAT! 🎉";
            desc.textContent = `Kamu berhasil menyeberangi kolam dengan Skor Akhir: ${score}`;
        } else {
            title.textContent = "GAME OVER 💦";
            desc.textContent = `Nyawa kamu habis karena katak tenggelam! Skor Akhir: ${score}`;
        }

        modal.style.display = 'flex';
    }
</script>

</body>
</html>
